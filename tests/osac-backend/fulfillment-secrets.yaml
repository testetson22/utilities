# Secrets for fulfillment-service — vendored from dcm-project/osac-service-provider
# test/e2e/manifests-tierb/fulfillment-secrets.yaml
#
# These are TEST-ONLY, STATIC credentials committed to git on purpose (NFR-TB-020
# from osac-sp-e2e-tier-b.spec.md). They match the osac-controller client secret
# in realm.json and the Postgres password in postgres.yaml. Never use these
# values for any real deployment.
#
# Applied by deploy-osac-backend.sh into the osac-test-backend namespace.
apiVersion: v1
kind: Secret
metadata:
  name: ffs-controller-credentials
  labels:
    app.kubernetes.io/part-of: osac-test-backend
type: Opaque
stringData:
  client-id: "osac-controller"
  client-secret: "tierb-osac-controller-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: ffs-database-credentials
  labels:
    app.kubernetes.io/part-of: osac-test-backend
type: Opaque
stringData:
  url: "postgres://postgres:tierb-postgres-password@ffs-postgres:5432/service?sslmode=disable"
  user: "postgres"
  password: "tierb-postgres-password"
