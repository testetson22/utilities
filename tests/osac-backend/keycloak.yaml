# ffs-keycloak — vendored from dcm-project/osac-service-provider test/e2e/manifests-tierb/keycloak.yaml
# OCP adaptation: Service type changed from NodePort to ClusterIP — external
# access is via an OCP passthrough Route generated by deploy-osac-backend.sh.
# The Certificate object is also generated by the script (it needs the Route
# hostname in its dnsNames for TLS verification to succeed from outside the cluster).
#
# Applied by deploy-osac-backend.sh into the osac-test-backend namespace.
# No namespace metadata here — the script applies with -n $OSAC_BACKEND_NAMESPACE.
#
# The ffs-keycloak-realm ConfigMap (containing realm.json) is created by the
# script directly from tests/osac-backend/realm.json.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffs-keycloak
  labels:
    app.kubernetes.io/name: ffs-keycloak
    app.kubernetes.io/part-of: osac-test-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ffs-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ffs-keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3
          args: ["start-dev", "--import-realm", "--health-enabled=true"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "tierb-keycloak-admin-password"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://ffs-postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              value: "postgres"
            - name: KC_DB_PASSWORD
              value: "tierb-postgres-password"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: "/etc/keycloak-tls/tls.crt"
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: "/etc/keycloak-tls/tls.key"
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: tls
              mountPath: /etc/keycloak-tls
              readOnly: true
          readinessProbe:
            # Keycloak's management port switches to HTTPS when TLS certs are configured.
            httpGet:
              path: /health/ready
              port: 9000
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: realm
          configMap:
            name: ffs-keycloak-realm
        - name: tls
          secret:
            secretName: ffs-keycloak-tls
---
apiVersion: v1
kind: Service
metadata:
  name: ffs-keycloak
  labels:
    app.kubernetes.io/name: ffs-keycloak
    app.kubernetes.io/part-of: osac-test-backend
spec:
  # ClusterIP for OCP — external access is via a passthrough Route.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ffs-keycloak
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
