apiVersion: v1
kind: Namespace
metadata:
  name: osac-controller-simulator
  labels:
    app.kubernetes.io/part-of: osac-sp-contract-simulator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osac-controller-simulator
  namespace: osac-controller-simulator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: osac-controller-simulator
  namespace: default
rules:
  - apiGroups: [osac.openshift.io]
    resources: [clusterorders, computeinstances]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [osac.openshift.io]
    resources: [clusterorders/status, computeinstances/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: osac-controller-simulator
  namespace: default
subjects:
  - kind: ServiceAccount
    name: osac-controller-simulator
    namespace: osac-controller-simulator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: osac-controller-simulator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osac-controller-simulator
  namespace: osac-controller-simulator
  labels:
    app.kubernetes.io/name: osac-controller-simulator
    app.kubernetes.io/part-of: osac-sp-contract-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: osac-controller-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osac-controller-simulator
    spec:
      serviceAccountName: osac-controller-simulator
      containers:
        - name: controller
          image: osac-controller-simulator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SIMULATOR_OSAC_NAMESPACE
              value: default
            - name: SIMULATOR_SCENARIO
              value: ready
