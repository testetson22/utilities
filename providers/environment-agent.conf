# Environment Agent
# Bridges external service providers (e.g. OSAC SP) to the DCM control plane.
# Required when deploying any SP that registers via environment-agent rather
# than directly with control-plane (e.g. --osac-service-provider).
#
# The full service definition lives in COMPOSE_OVERRIDE (our test-specific image,
# env vars, ports). The base control-plane compose.yaml also defines environment-agent
# under profiles: ["environment-agent"], so we must activate that profile here to
# make the merged service run — podman-compose preserves the base profiles attribute
# through overlay merges and won't start the service without the profile active.

PROVIDER_LABEL="environment-agent"
PROVIDER_FLAG="environment-agent"
PROVIDER_DESCRIPTION="Enable the environment agent (required for external SPs like OSAC)"

COMPOSE_PROFILE="environment-agent"
COMPOSE_OVERRIDE="tests/compose-environment-agent-test.yaml"

# No cluster CLI or namespace needed.
CLI_REQUIREMENT=""
NAMESPACE_FLAG=""
NAMESPACE_ENV=""
NAMESPACE_DEFAULT=""
KUBECONFIG_EXPORT=""
NAMESPACE_EXPORT=""
VALIDATE_HOOK=""
