# OSAC Service Provider
# Integrates the Open Sovereign AI Cloud (OSAC) fulfillment service with DCM,
# provisioning OpenShift clusters (serviceType: cluster) and VMs (serviceType: vm)
# via OSAC's gRPC fulfillment API.
#
# Requires: OSAC dev/MOC credentials set in the shell or deploy/.env:
#   SP_OSAC_FULFILLMENT_ADDRESS  — gRPC endpoint (host:port)
#   SP_OSAC_OIDC_ISSUER_URL      — Keycloak realm URL
#   SP_OSAC_OIDC_CLIENT_ID       — client ID (e.g. osac-admin)
#   SP_OSAC_OIDC_CLIENT_SECRET   — client secret
#
# Requires: --environment-agent (OSAC SP registers with env-agent, not control-plane directly).
# The validate_osac_provider hook enforces this.
#
# The service definition lives entirely in COMPOSE_OVERRIDE so this works
# without control-plane having the osac-service-provider profile.

PROVIDER_LABEL="osac"
PROVIDER_FLAG="osac-service-provider"
PROVIDER_DESCRIPTION="Enable the OSAC service provider (requires OSAC fulfillment credentials and --environment-agent)"

# Full service definition is in COMPOSE_OVERRIDE — no profile in base compose.yaml needed.
COMPOSE_PROFILE=""
COMPOSE_OVERRIDE="tests/compose-osac-sp.yaml"

# No OCP cluster CLI required — OSAC SP talks gRPC to OSAC, not K8s directly.
CLI_REQUIREMENT=""
NAMESPACE_FLAG=""
NAMESPACE_ENV=""
NAMESPACE_DEFAULT=""
KUBECONFIG_EXPORT=""
NAMESPACE_EXPORT=""
VALIDATE_HOOK="validate_osac_provider"
